# Requires a CHANGELOG entry per PR (see scripts/check-changelog-entry.sh).
#
# A standalone workflow — not a job in ci.yaml — so it can trigger on `labeled`
# / `unlabeled` too: applying the `skip-changelog` label re-runs THIS guard (and
# only this guard, not all of CI) with the updated label set, so the exemption
# takes effect immediately. Entries under `## [Unreleased]` were manual and
# repeatedly forgotten, back-filled by separate "docs(changelog)" PRs
# (#529/#532/#708/#739/#756/#780/#781/#888); this ends that pattern.
name: CHANGELOG guard
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog-guard:
    name: CHANGELOG entry present
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Exempt PRs with no user-facing change (release-prep, chore, dependabot,
    # docs-only). The `labeled`/`unlabeled` triggers above make this re-evaluate
    # as soon as the label is added or removed.
    #
    # Dependabot is exempt by author, not by label. This comment already named
    # it, but nothing wired it up: .github/dependabot.yaml applies
    # ["dependencies", "<ecosystem>"] and never `skip-changelog`, so every
    # Dependabot PR failed this guard and could not merge without someone
    # labelling it by hand. Keying on the author rather than adding the label to
    # four ecosystem blocks keeps one mechanism instead of two, and survives a
    # label being removed. pull_request.user.login is the PR's author, unlike
    # github.actor, which on a `labeled` event is whoever applied the label.
    if: >-
      ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
          && github.event.pull_request.user.login != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # base_ref goes through the environment rather than into the command text:
      # ${{ }} is substituted before the shell sees it, and git refnames permit
      # ';', '$(' and backticks. Unreachable while `branches: [main]` pins it,
      # but nothing would catch it if that pin were widened (#970).
      - name: Fetch the base branch tip
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
      - name: Require a CHANGELOG [Unreleased] entry (or the skip-changelog label)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-changelog-entry.sh "origin/$BASE_REF"
