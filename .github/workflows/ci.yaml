name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"
  PYTHON_VERSION: "3.11"
  GOLANGCI_LINT_VERSION: "v2.12.2"

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Lint enforces ADR 0012 (Go Report Card A+ floor)
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (golangci-lint A+ enforcement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  # ─────────────────────────────────────────────────────────────────────
  # Proto drift: the generated gRPC code (proto/agent/v1) is committed, so a
  # change to proto/agent.proto without re-running `buf generate` would ship a
  # stale stub. Regenerate in CI and fail if the working tree differs.
  # ─────────────────────────────────────────────────────────────────────
  proto-drift:
    name: Proto generated code is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Plugins are pinned: protoc-gen-go to the go.mod version, protoc-gen-go-grpc
      # to v1.6.2 — these MUST match the versions the committed code was generated
      # with, or this check reports false drift.
      - name: Install protoc-gen plugins
        run: |
          set -euo pipefail
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@$(go list -m -f '{{.Version}}' google.golang.org/protobuf)"
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: buf generate
        run: buf generate
      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- proto/; then
            echo "::error::proto/agent/v1 is out of sync with proto/agent.proto. Run 'buf generate' and commit." >&2
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────
  # Lint the GitHub Actions workflows themselves (actionlint). A malformed
  # workflow can silently fail to trigger or break a release; catching schema and
  # expression errors here keeps the CI/release workflows valid before they merge.
  # ─────────────────────────────────────────────────────────────────────
  workflow-lint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  # ─────────────────────────────────────────────────────────────────────
  # Tests (ADR 0011: TDD with coverage floor per phase)
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: public.ecr.aws/docker/library/redis:7
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgres://leoflow:leoflow@localhost:5432/leoflow_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Enforce coverage floor
        run: |
          # Coverage floor: 80% (raised from 78 after the alpha-prep batch
          # — #295/#296/#297/#299 — pushed the filtered total above 80%).
          # Exclude generated code, main packages, version, and the
          # process-orchestration of external binaries (Docker/initdb/pg_ctl)
          # that only integration/e2e can exercise honestly, per ADR 0011.
          FLOOR=80
          EXCLUDE='(/internal/storage/queries/|/internal/storage/repository\.go:|/internal/storage/postgres\.go:|/internal/storage/redis\.go:|/internal/storage/scheduler_store\.go:|/internal/storage/agent_store\.go:|/internal/storage/xcom_index\.go:|/internal/xcom/redis_backend\.go:|/internal/logs/tail\.go:|/internal/scheduler/leader\.go:|/internal/cli/managed_postgres\.go:|/internal/cli/backup_cmd\.go:|/internal/cli/restore_cmd\.go:|/internal/cli/forget\.go:|/internal/cli/dbt_manifest\.go:|\.pb\.go:|/internal/version/|/cmd/)'
          grep -vE "$EXCLUDE" coverage.out > coverage.filtered.out
          TOTAL=$(go tool cover -func=coverage.filtered.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Total coverage (filtered): ${TOTAL}% (floor: ${FLOOR}%)"
          AWK_RESULT=$(awk -v t="$TOTAL" -v f="$FLOOR" 'BEGIN { print (t < f) }')
          if [ "$AWK_RESULT" = "1" ]; then
            echo "::error::Coverage ${TOTAL}% is below floor ${FLOOR}% (see ADR 0011)"
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out

  # ─────────────────────────────────────────────────────────────────────
  # Integration tests (//go:build integration) against real Postgres + Redis.
  # Exercises the DB/lock-binding code excluded from the unit-coverage floor.
  # ─────────────────────────────────────────────────────────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: public.ecr.aws/docker/library/redis:7
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://leoflow:leoflow@localhost:5432/leoflow_test?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Apply migrations
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          migrate -path migrations -database "$DATABASE_URL" up

      - name: Run integration tests
        run: go test -tags integration -race ./...

  # ─────────────────────────────────────────────────────────────────────
  # End-to-end Lite happy path: `leoflow setup` → control plane with REAL auth
  # → admin login returns a JWT (and a wrong password is rejected). Runs against
  # throwaway Postgres+Redis services, so the script's leoflow_dev reset is safe.
  # ─────────────────────────────────────────────────────────────────────
  e2e-lite:
    name: E2E Lite (setup → login)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: public.ecr.aws/docker/library/redis:7
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Lite happy path (setup → login)
        run: bash test/e2e/lite-login.sh

  # ─────────────────────────────────────────────────────────────────────
  # Multi-DAG materialization gate (ADR 0033).
  # Asserts the contract `dag.json.source` carries dag.py byte-for-byte for
  # subdir projects, the parser→spec property the subprocess executor depends
  # on to materialize per-task-instance work dirs. Catches the regression that
  # shipped in v0.0.1-prealpha.21 where multi-DAG workspaces failed every task
  # with `ModuleNotFoundError: No module named 'dag'`. No Postgres needed —
  # the contract is in the compiled artifact, not in any runtime state. ~5 s.
  # ─────────────────────────────────────────────────────────────────────
  e2e-lite-multidag:
    name: E2E Lite (multi-DAG materialization gate)
    runs-on: ubuntu-latest
    env:
      # The script runs `leoflow compile`, which spawns the parser via
      # `python3 -m leoflow_parser`. The repo ships the parser source under
      # parser/leoflow_parser; export PYTHONPATH so the import resolves on a
      # bare runner (no pip install, no venv, no extra setup-python action).
      PYTHONPATH: parser
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Multi-DAG materialization contract
        run: bash test/e2e/lite-multidag.sh

  # ─────────────────────────────────────────────────────────────────────
  # Lite boot self-heal gate (#404). Two `leoflow lite` sessions share one
  # external Postgres; the second's boot reconcile must deregister a DAG whose
  # files were removed and clear its orphan import error, while keeping a valid
  # DAG. Catches the regression where the watcher seeded its set-diff from the
  # workspace instead of the control plane, leaving un-removable ghosts.
  # ─────────────────────────────────────────────────────────────────────
  e2e-lite-selfheal:
    name: E2E Lite (boot self-heal gate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow_dev
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # leoflow lite spawns the parser via `python3 -m leoflow_parser`; ship its
      # source on PYTHONPATH so the import resolves on a bare runner.
      PYTHONPATH: parser
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Lite boot self-heal (#404)
        run: bash test/e2e/lite-selfheal.sh

  # ─────────────────────────────────────────────────────────────────────
  # Native on-failure alerting gate (#424). A DAG with an `alerts:` block and a
  # single http_api task that fails (500) is triggered; the scheduler must fire a
  # real webhook POST — resolved from an encrypted managed connection, rendered
  # from the message template — to a local receiver. Exercises the whole Go
  # control-plane chain (compile → dag.json → scheduler → dispatcher → notifier)
  # against a real DB and real connection encryption, which the unit tests can't.
  # ─────────────────────────────────────────────────────────────────────
  e2e-lite-alerts:
    name: E2E Lite (on-failure alerting gate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow_dev
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # leoflow lite spawns the parser via `python3 -m leoflow_parser`; ship its
      # source on PYTHONPATH so the import resolves on a bare runner.
      PYTHONPATH: parser
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Native on-failure alerting (#424)
        run: bash test/e2e/lite-alerts.sh

  # ─────────────────────────────────────────────────────────────────────
  # Airflow on_failure_callback gate (#424). A @task that raises must run its
  # native on_failure_callback in the task process, once, on the terminal failure —
  # resolved off the loaded task object (works for an unbound `with DAG():`) and
  # called even though Airflow normalises it to a list. The callback POSTs the real
  # Airflow context to a local receiver; asserts it fired exactly once. Guards the
  # two integration bugs the unit tests (fake resolver/callback) missed.
  # ─────────────────────────────────────────────────────────────────────
  e2e-lite-callback:
    name: E2E Lite (on_failure_callback gate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow_dev
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # leoflow lite spawns the parser via `python3 -m leoflow_parser`; ship its
      # source on PYTHONPATH so the import resolves on a bare runner.
      PYTHONPATH: parser
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Airflow on_failure_callback (#424)
        run: bash test/e2e/lite-callback.sh

  # ─────────────────────────────────────────────────────────────────────
  # Headless SPA crash smoke (test/e2e/ui-smoke.js): boots Lite (managed PG, no
  # Docker), drives the embedded Airflow 3.2 UI with a real browser, and fails on
  # any uncaught React error. The Go tests cannot see the React layer — the
  # connector config page once shipped broken (catalog omitted standard_fields
  # keys the SPA reads) and only a browser caught it. This guards that whole class
  # plus the logs render contract. ~4 min (chromium + relocatable PG download).
  # ─────────────────────────────────────────────────────────────────────
  ui-smoke:
    name: UI smoke (headless SPA crash check)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: parser
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - name: Build binaries
        run: make build
      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm i --no-save playwright-core playwright
          npx playwright install --with-deps chromium
      - name: Boot Lite and run the UI smoke
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          # `leoflow setup` prints the admin password once; capture it.
          PW=$(leoflow setup 2>&1 | tee /tmp/setup.log | grep -oiE 'password:[[:space:]]*[A-Za-z0-9]+' | head -1 | awk '{print $NF}')
          [ -n "$PW" ] || { echo "could not capture admin password"; cat /tmp/setup.log; exit 1; }
          leoflow lite --port 18080 --postgres managed --executor subprocess \
            --server-bin "$PWD/bin/leoflow-server" --agent-bin "$PWD/bin/leoflow-agent" > /tmp/lite.log 2>&1 &
          for _ in $(seq 1 60); do curl -fsS http://localhost:18080/readyz >/dev/null 2>&1 && break; sleep 3; done
          curl -fsS http://localhost:18080/readyz >/dev/null || { echo "lite did not become ready"; tail -40 /tmp/lite.log; exit 1; }
          TOK=$(leoflow auth create-token --server http://localhost:18080 --username admin@leoflow.local --password "$PW")
          # Wait for the scaffolded "hello" DAG to register (its venv installs first), then run it for log content.
          for _ in $(seq 1 40); do curl -fsS -H "Authorization: Bearer $TOK" http://localhost:18080/api/v2/dags/hello >/dev/null 2>&1 && break; sleep 3; done
          curl -fsS -X POST -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' -d '{}' \
            http://localhost:18080/api/v2/dags/hello/dagRuns >/dev/null 2>&1 || true
          sleep 10
          LEOFLOW_URL=http://localhost:18080 LEOFLOW_USER=admin@leoflow.local LEOFLOW_PASS="$PW" \
            node test/e2e/ui-smoke.js

  # ─────────────────────────────────────────────────────────────────────
  # Full pod-per-task e2e on a real k3d cluster (test/e2e/e2e.sh): builds the
  # base + DAG images, runs the control plane on the runner, triggers a DAG, and
  # asserts every task reaches success — including a provider SENSOR
  # (type=airflow_operator, ADR 0040) that runs in its own pod and resolves a
  # managed Connection. This is the operator chain's end-to-end gate. On Linux the
  # pods reach the host control plane via host.k3d.internal (k3d injects it into
  # CoreDNS). ~10 min.
  # ─────────────────────────────────────────────────────────────────────
  operator-e2e:
    name: E2E operators (k3d pod-per-task)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: public.ecr.aws/docker/library/redis:7
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # The control plane runs on the runner; k3d pods dial it via host.k3d.internal
      # (Linux only — Docker Desktop uses host.docker.internal, the e2e default).
      LEOFLOW_E2E_HOST_ADDR: host.k3d.internal
      # leoflow compile spawns `python3 -m leoflow_parser`; the parser ships under
      # parser/ and needs no install — just PYTHONPATH (the airflow-free shim).
      PYTHONPATH: parser
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install k3d + kubectl + jq + migrate
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/v5.7.4/install.sh | TAG=v5.7.4 bash
          curl -fsSLO "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - name: Apply migrations
        run: ~/go/bin/migrate -path migrations -database "postgres://leoflow:leoflow@localhost:5432/leoflow?sslmode=disable" up
      - name: Build binaries
        run: make build
      - name: Run the k3d operator e2e
        run: bash test/e2e/e2e.sh

  # e2e-dbt: dbt-native orchestration on a real k3d cluster (test/e2e/dbt-e2e.sh +
  # dbt-mixing-e2e.sh). A dbt project compiles to one pod per model; the mixing
  # script proves a dbt project in a subdir (transform/) wired around operators,
  # scoped with --project-dir (#401), against a shared Postgres warehouse. The
  # cloud adapters (snowflake/bigquery/databricks) are validated by hand in the RC
  # soak -- dbt-connection-e2e.sh needs real cloud credentials and is not gated here.
  e2e-dbt:
    name: E2E dbt (k3d pod-per-model)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: public.ecr.aws/docker/library/redis:7
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LEOFLOW_E2E_HOST_ADDR: host.k3d.internal
      PYTHONPATH: parser
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install k3d + kubectl + jq + migrate + dbt
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/v5.7.4/install.sh | TAG=v5.7.4 bash
          curl -fsSLO "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          pip install --quiet dbt-core dbt-postgres
      - name: Apply migrations
        run: ~/go/bin/migrate -path migrations -database "postgres://leoflow:leoflow@localhost:5432/leoflow?sslmode=disable" up
      - name: Build binaries
        run: make build
      - name: Run the dbt e2e (postgres warehouse)
        run: bash test/e2e/dbt-e2e.sh
      - name: Run the dbt mixing e2e (subdir + --project-dir, #401)
        run: bash test/e2e/dbt-mixing-e2e.sh

  # deploy-e2e: the real `leoflow deploy` path on k3d with a registry the cluster
  # pulls from (test/e2e/deploy-e2e.sh, ADR 0041). One `leoflow deploy` builds for
  # the cluster arch, pushes to a k3d-managed registry, captures the digest,
  # re-pins dag.json, registers -- then the cluster pulls the digest-pinned image
  # and runs it. Gates the build/push/digest/register glue. ~10 min.
  deploy-e2e:
    name: E2E deploy (k3d + registry)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: leoflow
          POSTGRES_PASSWORD: leoflow
          POSTGRES_DB: leoflow
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: public.ecr.aws/docker/library/redis:7
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # k3d pods dial the runner control plane via host.k3d.internal (Linux only).
      LEOFLOW_E2E_HOST_ADDR: host.k3d.internal
      PYTHONPATH: parser
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install k3d + kubectl + jq + migrate
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/v5.7.4/install.sh | TAG=v5.7.4 bash
          curl -fsSLO "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - name: Apply migrations
        run: ~/go/bin/migrate -path migrations -database "postgres://leoflow:leoflow@localhost:5432/leoflow?sslmode=disable" up
      - name: Build binaries
        run: make build
      - name: Run the k3d deploy e2e
        run: bash test/e2e/deploy-e2e.sh

  # ─────────────────────────────────────────────────────────────────────
  # TDD discipline check: every new exported function in production code
  # must have a corresponding test added or modified in the same PR.
  # This is a best-effort heuristic; reviewers verify the spirit of ADR 0011.
  # ─────────────────────────────────────────────────────────────────────
  tdd-check:
    name: TDD discipline (commit pattern check)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Verify test commits exist for production changes
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          PROD_FILES=$(git diff --name-only "$BASE" "$HEAD" -- '*.go' ':!*_test.go' ':!vendor/*' ':!proto/*' | wc -l)
          TEST_FILES=$(git diff --name-only "$BASE" "$HEAD" -- '*_test.go' | wc -l)
          echo "Production .go files changed: $PROD_FILES"
          echo "Test .go files changed: $TEST_FILES"
          if [ "$PROD_FILES" -gt 0 ] && [ "$TEST_FILES" -eq 0 ]; then
            echo "::warning::Production code changed without test changes. Verify ADR 0011 was followed."
          fi

  # ─────────────────────────────────────────────────────────────────────
  # Build all binaries
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/leoflow ./cmd/leoflow
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/leoflow-server ./cmd/leoflow-server
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/leoflow-agent ./cmd/leoflow-agent

      - name: Check agent binary size (<20MB per ADR 0004)
        run: |
          SIZE=$(stat -c%s bin/leoflow-agent)
          MAX=20971520  # 20 MB
          echo "leoflow-agent size: $SIZE bytes (max: $MAX)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::leoflow-agent exceeds 20MB cap (see ADR 0004)"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────
  # Validate OpenAPI spec (ADR 0013)
  # ─────────────────────────────────────────────────────────────────────
  openapi-lint:
    name: OpenAPI spec lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Install redocly CLI
        run: npm install -g @redocly/cli@latest

      - name: Lint OpenAPI spec
        run: redocly lint docs/api/openapi.yaml

  # ─────────────────────────────────────────────────────────────────────
  # Examples Dockerfile drift check (#318). The Dockerfile in each
  # examples/<name>/ is generated from leoflow.yaml by
  # scripts/sync-example-dockerfiles.sh. If a contributor changes the
  # YAML (python_version or dependencies) and forgets to regenerate, the
  # checked-in Dockerfile lies about what the image will run. Catch
  # that drift here so a Pro operator copying the Dockerfile out as a
  # template gets the same image Lite would have produced.
  # ─────────────────────────────────────────────────────────────────────
  examples-dockerfile-drift:
    name: Examples Dockerfile drift (#318)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Check Dockerfiles are in sync with leoflow.yaml
        run: bash scripts/sync-example-dockerfiles.sh --check

  # ─────────────────────────────────────────────────────────────────────
  # Python parser tests — matrix across every Python the host detector
  # claims to support (`internal/setup/detect.go` pythonCandidates). If a
  # new minor is added to that list, add it here too — otherwise the
  # detector promises compatibility we never verified, which is exactly
  # the silent-regression risk #220 (F2) flagged. Only 3.11/3.12/3.13 are
  # generally available today; bump as 3.14+ ship and stabilise.
  python-parser:
    name: Python parser tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: parser
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v --cov=leoflow_parser --cov-fail-under=70

  # ─────────────────────────────────────────────────────────────────────
  # Python task runtime tests
  # ─────────────────────────────────────────────────────────────────────
  python-runtime:
    name: Python runtime tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/python
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v --cov=leoflow_runtime --cov-fail-under=90
