name: Release

on:
  push:
    tags: ["v*"]

# Least-privilege default: read-only at the top level. Each job that needs to
# write (the release publish, the migrate image push, the gate's draft-edit)
# opts in explicitly. OpenSSF Scorecard Token-Permissions check penalises any
# write that lives at the workflow scope.
permissions:
  contents: read

env:
  GO_VERSION: "1.26.3"
  REGISTRY: ghcr.io

jobs:
  release:
    name: Build, sign, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GoReleaser creates the GitHub release.
      packages: write   # Push the leoflow-server image to GHCR.
      id-token: write   # Cosign keyless signing via Sigstore OIDC.
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # ── Sigstore cosign for keyless signing ──
      # Pin cosign to the 2.4.x line: cosign 3.x changed `sign-blob` to write a
      # Sigstore bundle by default, which breaks GoReleaser's
      # --output-signature/--output-certificate recipe ("create bundle file:
      # open : no such file or directory").
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3

      # ── syft for SBOM generation ──
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      # ── QEMU + Buildx so the arm64 control-plane image builds on the amd64 runner ──
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Bake the pre-alpha expiry: build time + 90 days (UTC, RFC3339) ──
      # internal/version reads this via the expiresAt ldflag. Only pre-alpha tags
      # (v*-prealpha.*) carry an expiry; for stable tags this step is skipped, so
      # env.EXPIRES_AT stays empty and GoReleaser bakes an empty value = no expiry.
      # Must run before GoReleaser.
      - name: Compute alpha expiry
        if: contains(github.ref_name, '-prealpha.')
        run: echo "EXPIRES_AT=$(date -u -d '+90 days' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # ── GoReleaser handles the build, packaging, signing, and release ──
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPIRES_AT: ${{ env.EXPIRES_AT }}

  # ── Build + push leoflow-migrate (golang-migrate + Leoflow migrations)
  # The Helm chart's migration Job (#34/#48) defaults to
  # ghcr.io/neochaotic/leoflow-migrate:<tag>; this job publishes that image,
  # multi-arch, on every release tag in parallel with install-smoke.
  #
  # Dockerfile.migrate is `FROM migrate/migrate + COPY migrations/` — no Go
  # binary, so GoReleaser's dockers block (which expects a built artifact) is
  # overkill. docker/build-push-action is the simpler shape here.
  migrate-image:
    name: Build + push leoflow-migrate image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless cosign signing
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/leoflow-migrate
          # ref,event=tag stamps the tag verbatim (v0.0.1-prealpha.18); the
          # semver pattern strips the leading `v` so users pinning by version
          # (0.0.1-prealpha.18) work too. No `:latest` for pre-alpha tags —
          # GoReleaser doesn't push `:latest` for leoflow-server either, so
          # the two images stay in sync.
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build + push (multi-arch)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile.migrate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Mirror the supply-chain posture of leoflow-server: keyless cosign sign
      # every published tag by digest (ADR 0014). Without `--yes` cosign would
      # prompt for OIDC confirmation; CI passes the Sigstore challenge via the
      # GH OIDC token from id-token: write.
      - name: Sign image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

  # ── Faithful install smoke: run the REAL `curl | sh` of the just-published
  # release in a clean container per distro and verify the binary plus the managed
  # CPython actually run. This catches install-path bugs (PATH, checksum, tar, the
  # relocatable CPython, glibc/musl) — the class of failure that previously only
  # surfaced on real machines. GoReleaser publishes pre-releases (publicly
  # downloadable, so `curl | sh` works here); if ANY distro fails, the `gate` job
  # below retracts the release to a draft. Net effect: a release only survives if
  # it installs cleanly on every supported distro ("só corta se passar").
  install-smoke:
    name: Install smoke (${{ matrix.image }})
    needs: release
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: sh # Alpine ships busybox sh, not bash; keep every distro on sh.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12", prep: "apt-get update -qq && apt-get install -y -qq curl ca-certificates tar" }
          - { image: "ubuntu:24.04", prep: "apt-get update -qq && apt-get install -y -qq curl ca-certificates tar" }
          - { image: "fedora:41", prep: "dnf install -y -q tar curl --allowerasing" }
          - { image: "quay.io/rockylinux/rockylinux:9", prep: "dnf install -y -q tar curl --allowerasing" }
          - { image: "opensuse/leap:15", prep: "zypper -n in -y curl tar gzip" }
          - { image: "archlinux:latest", prep: "pacman -Sy --noconfirm curl tar" }
          - { image: "alpine:3.20", prep: "apk add --no-cache curl tar" }
    steps:
      - name: Install prerequisites (curl + tar)
        run: ${{ matrix.prep }}

      - name: Install Leoflow via the published install.sh
        env:
          LEOFLOW_VERSION: ${{ github.ref_name }} # pin to the just-pushed tag
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh" | sh

      - name: Verify the binary and managed CPython run
        run: |
          set -eu
          leoflow version
          "$HOME/.leoflow/python/bin/python3.11" --version

  # ── Cold-start smoke (#96): the actual user flow we cannot reproduce in
  # any other gate — install fresh, run `leoflow setup`, boot `leoflow lite`,
  # wait for /readyz to respond. Catches the class of bug where the binary
  # is installed correctly but boot fails (Postgres race, managed-runtime
  # missing libs, agent port collision, etc.). Uses `--postgres managed` so
  # the smoke does NOT need Docker-in-Docker; the relocatable Postgres
  # `leoflow setup` extracted is exercised here for real. Pinned to ubuntu
  # (the most representative dev environment); the 7-distro install-smoke
  # above still gates `--version` works on each distro. Extending the cold
  # start to more distros lands as managed-runtime portability work (#97)
  # validates each base.
  lite-cold-start-smoke:
    name: Lite cold-start (boot + /readyz, managed PG)
    needs: release
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install prerequisites
        run: |
          apt-get update -qq
          # libicu74 + krb5-libs are linked by the relocatable Postgres binary;
          # a stock ubuntu:24.04 image ships without them so `leoflow lite
          # --postgres managed` errors out at boot ("system libraries missing").
          # Real Ubuntu desktops typically have these via libreoffice/curl,
          # but a slim CI container does not — install them explicitly so the
          # smoke job actually exercises the managed-PG path (#96).
          apt-get install -y -qq curl ca-certificates tar procps libicu74 libgssapi-krb5-2
      - name: Install Leoflow via the published install.sh
        env:
          LEOFLOW_VERSION: ${{ github.ref_name }}
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh" | sh
      - name: leoflow setup (non-interactive, defaults)
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p /tmp/ws
          leoflow setup --workspace /tmp/ws </dev/null
      - name: Boot leoflow lite and wait for /readyz
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"
          # Background lite; capture stdout+stderr so we can dump on failure.
          leoflow lite --postgres managed --port 8088 --host 127.0.0.1 >/tmp/lite.log 2>&1 &
          LITE_PID=$!
          # Poll /readyz up to 60s. The Postgres-retry budget is 30s by
          # itself; budget here is loose enough that a managed-PG cold extract
          # is not penalized while still catching real hangs.
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8088/readyz >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::/readyz never responded after 60s"
            echo "--- lite log (tail) ---"
            tail -200 /tmp/lite.log || true
            kill -TERM "$LITE_PID" 2>/dev/null || true
            exit 1
          fi
          echo "✓ /readyz responded"
          # Graceful shutdown; assert SIGTERM is honored (otherwise the
          # process becomes a CI zombie and future runs leak).
          kill -TERM "$LITE_PID"
          wait "$LITE_PID" 2>/dev/null || true

  # ── Upgrade-in-place smoke (#150): install the previous non-draft prerelease,
  # then install THIS tag on top, asserting the new version is in place. Catches
  # the install.sh bug class where a fresh box succeeds but layering over an
  # existing ~/.leoflow/ breaks. The gate retracts the release to a draft on
  # failure, same as install-smoke. Skipped automatically when there is no
  # previous non-draft release to upgrade from (the first published tag).
  upgrade-smoke:
    name: Upgrade smoke (previous → ${{ github.ref_name }})
    needs: release
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install prerequisites
        run: |
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates tar git
          # gh CLI for release listing
          mkdir -p /etc/apt/keyrings
          chmod 755 /etc/apt/keyrings
          out=$(mktemp) && curl -sL https://cli.github.com/packages/githubcli-archive-keyring.gpg > "$out" && cat "$out" > /etc/apt/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt-get update -qq
          apt-get install -y -qq gh
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run upgrade smoke
        env:
          LEOFLOW_REPO: ${{ github.repository }}
          LEOFLOW_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh test/release/upgrade-smoke.sh

  # ── Release gate: if any of the smoke jobs OR the migrate-image build
  # failed, retract the pre-release to a draft so `curl | sh` (which resolves
  # the newest public release) and the Helm chart (which references the
  # migrate image by tag) stop handing users a broken build. Runs always() so
  # it can act on any failure; on success it leaves the published pre-release
  # untouched.
  gate:
    name: Gate release on install + lite-cold-start + upgrade + migrate image
    needs: [release, install-smoke, lite-cold-start-smoke, upgrade-smoke, migrate-image]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Edit the published release back to a draft on failure.
    steps:
      - name: Retract release to draft on smoke or migrate-image failure
        if: needs.install-smoke.result != 'success' || needs.lite-cold-start-smoke.result != 'success' || needs.upgrade-smoke.result != 'success' || needs.migrate-image.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          echo "::error::release blocked: install-smoke=${{ needs.install-smoke.result }} lite-cold-start-smoke=${{ needs.lite-cold-start-smoke.result }} upgrade-smoke=${{ needs.upgrade-smoke.result }} migrate-image=${{ needs.migrate-image.result }}; retracting ${GITHUB_REF_NAME} to a draft."
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft
          exit 1
      - name: Confirm release passed all gates
        if: needs.install-smoke.result == 'success' && needs.lite-cold-start-smoke.result == 'success' && needs.upgrade-smoke.result == 'success' && needs.migrate-image.result == 'success'
        run: echo "install smoke + lite cold-start + upgrade smoke + migrate-image passed; ${GITHUB_REF_NAME} stays published."
