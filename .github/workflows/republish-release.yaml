# Re-publish a release that the release gate retracted to a draft.
#
# Why this exists: most smoke jobs in release.yaml install with
# `curl … install.sh | sh`, and install.sh downloads from the PUBLIC
# release-asset URL. A draft release does not serve one. So once the gate
# retracts a release, every re-run of those jobs fails on the download rather
# than on the thing that actually failed — the green re-run the gate's own
# success step was written to handle can never happen (#979, observed live on
# v0.4.5-rc.1). Tags are immutable (ADR 0033), so without this the only exit is
# a new tag.
#
# Use it for a TRANSIENT failure only. If a smoke job found something real, the
# release should stay drafted.
name: Re-publish a retracted release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to re-publish (e.g. v0.4.5-rc.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  republish:
    name: Re-publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Flip the release out of draft.
    steps:
      - name: Re-publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          # Refuse anything that is not a release tag, so a typo cannot address
          # an unrelated release.
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::refusing to act on '$TAG': not a vN.N.N release tag"; exit 1 ;;
          esac
          # `gh release view` finds drafts; the public REST tag lookup does not.
          if ! state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease 2>/dev/null); then
            echo "::error::no release found for tag '$TAG'"; exit 1
          fi
          if [ "$(printf '%s' "$state" | jq -r .isDraft)" != "true" ]; then
            echo "$TAG is already published; nothing to do."
            exit 0
          fi
          # --draft=false leaves the prerelease flag untouched, so an rc stays
          # a pre-release.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Re-published $TAG (prerelease=$(printf '%s' "$state" | jq -r .isPrerelease))."
          echo "Now re-run the failed jobs on the release run for $TAG." >> "$GITHUB_STEP_SUMMARY"
