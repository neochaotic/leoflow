name: Website (Hugo+Docsy) build check

# PHASE 0 of the docs migration to Hugo + Docsy. This workflow ONLY builds the new
# site under website/ with `hugo --gc --minify` to prove it stays green — it never
# deploys anywhere and never touches the gh-pages branch. The live MkDocs+mike site
# (docs/, mkdocs.yml, docs.yml, docs-release.yaml) is a SEPARATE, untouched track
# and remains the published documentation until the cutover happens at full parity.
#
# Scoped to website/** so it never fires on changes to the live docs, and vice versa.
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website-build.yml"]
  pull_request:
    branches: [main]
    paths: ["website/**", ".github/workflows/website-build.yml"]
  workflow_dispatch:

# Least-privilege: read-only. No pages/deploy permissions on purpose — this job
# must never be able to publish.
permissions:
  contents: read

# Pin the toolchain. Docsy needs the Hugo EXTENDED build (SCSS) and Go (Hugo Modules).
env:
  HUGO_VERSION: "0.165.0"

jobs:
  build:
    name: hugo --gc --minify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Docsy's "last modified" + enableGitInfo want full history.
          fetch-depth: 0

      - name: Setup Go (for Hugo Modules)
        uses: actions/setup-go@v5
        with:
          go-version-file: website/go.mod

      - name: Setup Node (for Docsy PostCSS/autoprefixer)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python (for pdoc + generator post-processing)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugo Extended
        run: |
          set -euo pipefail
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -sSL "$url" -o /tmp/hugo.deb
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Install PostCSS toolchain
        working-directory: website
        run: npm ci

      # Regenerate the reference trees BEFORE hugo (parity with the live MkDocs
      # docs.yml pipeline: CLI from Cobra, Go from gomarkdoc, the OpenAPI spec for
      # Scalar, and the Python runtime API from pdoc). The generated trees ARE
      # committed (so a fresh clone / preview builds without these toolchains);
      # rerunning them here guarantees the committed pages can never drift from
      # source. Run from the repo root — each script cd's to the root itself.
      - name: Generate CLI reference (Cobra)
        run: ./website/scripts/gen-cli.sh
      - name: Generate Go reference (gomarkdoc)
        run: ./website/scripts/gen-go.sh
      - name: Refresh OpenAPI spec (Scalar)
        run: ./website/scripts/gen-openapi.sh
      - name: Generate Python runtime API (pdoc)
        run: ./website/scripts/gen-python.sh

      # TEMP DIAGNOSTIC — capture the environment Hugo hands to the PostCSS
      # subprocess, to pin down where `--permission` is injected. Removed once the
      # root cause is confirmed.
      - name: Diagnose Node env (temp)
        working-directory: website
        run: |
          echo "NODE_OPTIONS=[${NODE_OPTIONS:-<unset>}]"
          echo "--- env (node/permission) ---"
          env | grep -iE 'node|permission' || echo "(no node/permission env)"
          echo "--- node ---"
          which node; node --version
          echo "--- postcss bin shebang ---"
          head -1 node_modules/.bin/postcss || true
          head -1 node_modules/postcss-cli/index.js || true

      # No `hugo mod get -u` — that would upgrade past the pinned Docsy version in
      # go.mod. `hugo --gc` auto-downloads modules at exactly the pinned versions.
      - name: Build (no deploy)
        working-directory: website
        # The GitHub runner injects NODE_OPTIONS=--permission (a Node 24 flag) when it
        # forces the Node 20-targeted actions onto Node 24. Hugo's PostCSS subprocess
        # runs on the setup-node-pinned Node 20.20.2, which rejects --permission. Clear
        # NODE_OPTIONS for the build so the postcss child starts clean.
        env:
          NODE_OPTIONS: ""
        run: hugo --gc --minify --logLevel info

      - name: Upload built site (artifact only — NOT a deploy)
        uses: actions/upload-artifact@v4
        with:
          name: website-public
          path: website/public
          retention-days: 7
          if-no-files-found: error
