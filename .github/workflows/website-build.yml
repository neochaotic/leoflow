name: Website (Hugo+Docsy) build check

# PHASE 0 of the docs migration to Hugo + Docsy. This workflow ONLY builds the new
# site under website/ with `hugo --gc --minify` to prove it stays green — it never
# deploys anywhere and never touches the gh-pages branch. The live MkDocs+mike site
# (docs/, mkdocs.yml, docs.yml, docs-release.yaml) is a SEPARATE, untouched track
# and remains the published documentation until the cutover happens at full parity.
#
# Scoped to website/** so it never fires on changes to the live docs, and vice versa.
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website-build.yml"]
  pull_request:
    branches: [main]
    paths: ["website/**", ".github/workflows/website-build.yml"]
  workflow_dispatch:

# Least-privilege: read-only. No pages/deploy permissions on purpose — this job
# must never be able to publish.
permissions:
  contents: read

# Pin the toolchain. Docsy needs the Hugo EXTENDED build (SCSS) and Go (Hugo Modules).
env:
  HUGO_VERSION: "0.165.0"

jobs:
  build:
    name: hugo --gc --minify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Docsy's "last modified" + enableGitInfo want full history.
          fetch-depth: 0

      - name: Setup Go (for Hugo Modules)
        uses: actions/setup-go@v5
        with:
          go-version-file: website/go.mod

      - name: Setup Node (for Docsy PostCSS/autoprefixer)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Hugo Extended
        run: |
          set -euo pipefail
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -sSL "$url" -o /tmp/hugo.deb
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Install PostCSS toolchain
        working-directory: website
        run: npm ci

      # No `hugo mod get -u` — that would upgrade past the pinned Docsy version in
      # go.mod. `hugo --gc` auto-downloads modules at exactly the pinned versions.
      - name: Build (no deploy)
        working-directory: website
        run: hugo --gc --minify --logLevel info

      - name: Upload built site (artifact only — NOT a deploy)
        uses: actions/upload-artifact@v4
        with:
          name: website-public
          path: website/public
          retention-days: 7
          if-no-files-found: error
