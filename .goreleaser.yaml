# GoReleaser configuration for Leoflow pre-alpha releases.
#
# Produces static (CGO-free) binaries for linux/darwin × amd64/arm64, bundles all
# three binaries per platform into a single archive (so install.sh fetches the CLI,
# server, and agent in one download), publishes SHA-256 checksums, an SBOM per
# archive, cosign keyless signatures (the checksums file AND the control-plane
# image manifests), and a control-plane container image on GHCR.
version: 2

project_name: leoflow

before:
  hooks:
    - go mod tidy

builds:
  - id: leoflow
    main: ./cmd/leoflow
    binary: leoflow
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: &ldflags
      - -s -w
      - -X github.com/neochaotic/leoflow/internal/version.version={{ .Version }}
      - -X github.com/neochaotic/leoflow/internal/version.gitCommit={{ .Commit }}
      - -X github.com/neochaotic/leoflow/internal/version.buildDate={{ .Date }}
  - id: leoflow-server
    main: ./cmd/leoflow-server
    binary: leoflow-server
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: leoflow-agent
    main: ./cmd/leoflow-agent
    binary: leoflow-agent
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: *ldflags
  - id: leoflow-mcp
    main: ./cmd/leoflow-mcp
    binary: leoflow-mcp
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    # leoflow-mcp carries its version in `package main` (var version), so it needs
    # the unqualified `main.version` ldflag — the shared *ldflags anchor targets
    # internal/version.* and would leave main.version at its "dev" default.
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  - id: leoflow
    # One archive per platform containing all four binaries; install.sh extracts
    # them into ~/.leoflow/bin.
    ids: [leoflow, leoflow-server, leoflow-agent, leoflow-mcp]
    formats: [tar.gz]
    name_template: "leoflow_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - id: archive
    artifacts: archive

# Cosign keyless signing of the checksums file. Verifying the checksums covers
# every archive listed in it. Requires id-token: write (set in the workflow).
signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    artifacts: checksum
    output: true

# Control-plane container image (the binary embeds the UI). Built per arch and
# joined into a multi-arch manifest.
dockers:
  # Each per-arch image gets BOTH tag forms — `{{ .Version }}` (no `v`, the
  # GoReleaser default) AND `v{{ .Version }}` (the raw git tag). The migrate
  # workflow already publishes both forms via docker/metadata-action; keeping
  # server symmetric means a chart `--set image.tag=<X>` pin works no matter
  # which convention the operator follows.
  #
  # Signed keyless by the `docker_signs:` block below — both manifest tags, by
  # digest — so the control-plane image the Helm chart deploys carries the same
  # supply-chain posture (ADR 0014) as leoflow-migrate and leoflow-runtime, which
  # the release workflow signs in their own jobs.
  - id: server-amd64
    ids: [leoflow-server]
    goarch: amd64
    dockerfile: deploy/Dockerfile.server.release
    image_templates:
      - "ghcr.io/neochaotic/leoflow-server:{{ .Version }}-amd64"
      - "ghcr.io/neochaotic/leoflow-server:v{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/neochaotic/leoflow"
  - id: server-arm64
    ids: [leoflow-server]
    goarch: arm64
    dockerfile: deploy/Dockerfile.server.release
    image_templates:
      - "ghcr.io/neochaotic/leoflow-server:{{ .Version }}-arm64"
      - "ghcr.io/neochaotic/leoflow-server:v{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/neochaotic/leoflow"

docker_manifests:
  - name_template: "ghcr.io/neochaotic/leoflow-server:{{ .Version }}"
    image_templates:
      - "ghcr.io/neochaotic/leoflow-server:{{ .Version }}-amd64"
      - "ghcr.io/neochaotic/leoflow-server:{{ .Version }}-arm64"
  # `v`-prefixed manifest pointing at the same per-arch images. Pulls of
  # `:v0.0.1-prealpha.N` and `:0.0.1-prealpha.N` resolve to identical digests.
  - name_template: "ghcr.io/neochaotic/leoflow-server:v{{ .Version }}"
    image_templates:
      - "ghcr.io/neochaotic/leoflow-server:v{{ .Version }}-amd64"
      - "ghcr.io/neochaotic/leoflow-server:v{{ .Version }}-arm64"

# Cosign keyless signing of the control-plane image. `artifacts: manifests`
# signs each multi-arch manifest (`:{{ .Version }}` and `:v{{ .Version }}`) by
# its digest — the reference an operator actually pulls — so both tag shapes are
# covered. GoReleaser resolves the pushed manifest digest and substitutes it for
# ${digest}; `${artifact}@${digest}` therefore signs by digest, never by the
# mutable tag. Requires id-token: write (set in the workflow) for the Sigstore
# OIDC challenge; `--yes` skips cosign's interactive confirmation in CI.
#
# The command is the `scripts/cosign-retry.sh` wrapper rather than `cosign`
# itself: a transient GitHub-OIDC blip once failed a `cosign sign` mid-release
# and drafted an otherwise-good build, so every signature retries with backoff.
# The migrate/runtime workflow steps route through the same wrapper.
docker_signs:
  - id: server
    cmd: ./scripts/cosign-retry.sh
    artifacts: manifests
    args:
      - sign
      - "${artifact}@${digest}"
      - "--yes"
    output: true

release:
  github:
    owner: neochaotic
    name: leoflow
  # Pre-alpha tags (v0.x.y-alpha.N) are pre-releases; GoReleaser auto-detects the
  # prerelease suffix, but make it explicit.
  prerelease: auto
  name_template: "{{ .Tag }}"
  header: |
    ## Leoflow {{ .Tag }}

    A `0.x` (pre-1.0) build — SemVer carries the maturity, there is no separate
    alpha/beta, and the pre-alpha series ended at `v0.0.1` (ADR 0037). APIs and
    on-disk shape may still evolve between minor versions; `-rc.N` tags are release
    candidates gated by the E2E suite. Install **this exact release** with:

    ```bash
    curl -fsSL https://raw.githubusercontent.com/neochaotic/leoflow/{{ .Tag }}/install.sh | LEOFLOW_VERSION={{ .Tag }} sh
    ```

    > A bare `curl … | sh` installs the latest **stable** release (`/releases/latest`
    > excludes pre-releases), so on a pre-release page it would NOT give you `{{ .Tag }}`.
    > `LEOFLOW_VERSION` must sit on the **`sh`** side of the pipe (not `curl`) — a
    > `VAR=x curl … | sh` prefix sets the var for `curl` only, so `install.sh` would
    > not see it and would fall back to latest-stable.
  footer: |
    ---
    Artifacts are checksummed (SHA-256) and the checksums file is cosign-signed
    (keyless). Verify with `cosign verify-blob`.

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"
