# values-ha.yaml — the control plane in HA: two leader-elected replicas, task logs
# in object storage, a PodDisruptionBudget that renders itself, and a drain grace
# sized for a clean step-down.
#
# Use with:  helm install leoflow oci://ghcr.io/neochaotic/charts/leoflow -n leoflow \
#              -f values-ha.yaml
#
# Why HA. A single control-plane replica is evicted as ROUTINE cluster housekeeping
# — autoscaler consolidation / bin-packing (Karpenter on EKS, GKE Autopilot),
# node drains, node auto-upgrades — and every eviction costs a full restart:
# image pull + boot + leadership, tens of seconds during which nothing dispatches
# and in-flight tasks lean on the scheduler's post-restart grace. A second replica
# turns that into seconds of failover with no image pull: the scheduler
# leader-elects (active-passive), the API serves from both (active-active).
#
# Why the chart does not default to this. HA needs a log store every replica can
# write. The default install keeps task logs on a ReadWriteOnce PVC, which attaches
# to ONE node — a second replica hangs in ContainerCreating on a Multi-Attach error
# while `helm install` reports success. Flipping replicaCount globally would break
# every existing install on upgrade, so the chart keeps replicaCount: 1 and instead
# REFUSES to render `replicaCount > 1` onto a single-writer PVC. This file is the
# one-switch profile that satisfies that guard the recommended way.

replicaCount: 2

# ─── Task logs: object storage (recommended for HA) ─────────────────────────
# No PVC at all: every replica writes to and reads from the same bucket, the
# bucket owns durability and retention (lifecycle policy), and the Deployment can
# roll (RollingUpdate) because no single-writer volume is in the way.
#
# Auth is keyless-first: bind THIS control-plane ServiceAccount to a cloud
# identity via `serviceAccount.annotations` and leave the credential fields empty.
#
# The RWX alternative (an NFS / EFS / Filestore / Azure Files / CephFS class) is
# `logs.persistence.enabled: true` + `accessMode: ReadWriteMany` + an RWX
# `storageClass`, with `logs.sink.provider: disk` — keep it for clusters with no
# object store reachable from the control plane.
logs:
  persistence:
    enabled: false
  sink:
    # `s3` for AWS S3 / MinIO / Ceph RGW, `gcs` for Google Cloud Storage.
    provider: s3
    bucket: CHANGEME-leoflow-task-logs
    prefix: leoflow
    # [s3] Required by AWS S3; ignored by most S3-compatible stores.
    region: us-east-1

serviceAccount:
  annotations: {}
    # EKS (IRSA) for `s3`:
    # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/leoflow-control-plane
    # GKE (Workload Identity) for `gcs`:
    # iam.gke.io/gcp-service-account: leoflow-control-plane@PROJECT.iam.gserviceaccount.com

# ─── PodDisruptionBudget: auto ──────────────────────────────────────────────
# Left unset on purpose. `enabled` is tri-state and the default (auto) renders the
# PDB exactly when the guaranteed replica floor is above one — which it is here —
# keeping one replica serving while the other is evicted. Do NOT force it on a
# single replica: a `minAvailable: 1` budget over one pod blocks every voluntary
# eviction, so node drains hang and auto-upgrades stall.
podDisruptionBudget:
  minAvailable: 1

# ─── Drain grace ────────────────────────────────────────────────────────────
# A voluntary eviction sends SIGTERM and waits this long before SIGKILL. The server
# drains its HTTP listeners and releases the scheduler lease on SIGTERM; give it
# comfortably more than the Kubernetes default (30s) so the leader steps down
# cleanly and the standby takes over at once instead of waiting out the lock.
terminationGracePeriodSeconds: 60

# ─── EKS / Karpenter only: eviction protection opt-in (NOT set by default) ──
# `karpenter.sh/do-not-disrupt: "true"` exempts the node running this pod from
# Karpenter's VOLUNTARY disruption (consolidation, drift, expiration). It trades
# maintenance friction — that node is never consolidated or upgraded by Karpenter
# while the pod runs — for eviction protection, and does nothing against
# involuntary disruptions (node failure, spot reclamation). A second replica plus
# the auto PDB is the platform-neutral answer; reach for this only when you have
# measured that consolidation still evicts faster than failover on your cluster.
# podAnnotations:
#   karpenter.sh/do-not-disrupt: "true"

# ─── The usual Pro prerequisites (external datastores, secrets) ─────────────
# External datastores are mandatory for Pro (the embedded ones are Lite-only). For
# HA these should themselves be highly available (managed Postgres with failover,
# managed Redis with replicas): the control plane is only as available as the
# stores it leader-elects on.
database:
  url: "postgres://leoflow:CHANGEME@postgres:5432/leoflow?sslmode=require"
redis:
  url: "redis://redis:6379/0"

auth:
  jwtSecret: "CHANGEME-jwt-signing-secret"
# 32 raw bytes or 64-char hex. Generate: openssl rand -hex 32
secretKey: "CHANGEME-leoflow-secret-key-32by"

# Agent gRPC TLS: the auto-generated CA (default) is fine for a hand-driven install.
# For GitOps (ArgoCD/Flux) use cert-manager instead — see values-pro-tls.yaml.
