# values-ha.yaml — the control plane in HA: two leader-elected replicas spread
# across nodes, task logs in object storage, a PodDisruptionBudget that renders
# itself, and a drain grace sized for the shutdown work that can actually finish.
#
# Use with:  helm install leoflow oci://ghcr.io/neochaotic/charts/leoflow -n leoflow \
#              -f values-ha.yaml
#
# Why HA. A single control-plane replica is evicted as ROUTINE cluster housekeeping
# — autoscaler consolidation / bin-packing (Karpenter on EKS, GKE Autopilot),
# node drains, node auto-upgrades — and every eviction costs a full restart:
# image pull + boot + leadership, tens of seconds during which nothing dispatches
# and in-flight tasks lean on the scheduler's post-leadership grace. A second
# replica turns that into seconds of failover with no image pull: the scheduler
# leader-elects (active-passive), the API serves from both (active-active).
#
# Why the chart does not default to this. HA needs a log store every replica can
# write. The default install keeps task logs on a ReadWriteOnce PVC, which attaches
# to ONE node — a second replica hangs in ContainerCreating on a Multi-Attach error
# while `helm install` reports success. Flipping replicaCount globally would break
# every existing install on upgrade, so the chart keeps replicaCount: 1 and instead
# REFUSES to render `replicaCount > 1` onto a single-writer PVC. This file is the
# one-switch profile that satisfies that guard the recommended way.
#
# Not the split (api/scheduler) topology: in split mode the scheduler is pinned to
# one replica with no standby, so every scheduler eviction is still the full
# restart window. Non-split replicaCount: 2 is the topology that fails dispatch over.

replicaCount: 2

# ─── Spread the replicas across nodes ───────────────────────────────────────
# Without this, consolidation bin-packs both replicas onto one node — and two
# replicas on one node are one replica: a node failure takes the whole control
# plane, and the PDB (one of two must stay up, both on the drained node) then
# BLOCKS the eviction, the single-replica trap one level up. `ScheduleAnyway`,
# not `DoNotSchedule`: the latter leaves the second replica Pending forever on a
# single-node cluster, where the PDB then blocks every drain. `labelSelector` is
# omitted on purpose — the chart fills in the Deployment's own selector.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  # Multi-zone clusters: also prefer different zones, so a zonal outage leaves a
  # replica standing (still best-effort — ScheduleAnyway).
  # - maxSkew: 1
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: ScheduleAnyway

# ─── Task logs: object storage (recommended for HA) ─────────────────────────
# No PVC at all: every replica writes to and reads from the same bucket, and the
# Deployment can roll (RollingUpdate) because no single-writer volume is in the
# way. Know what is durable and when: the live tail the UI shows while a task runs
# is Redis pub/sub and works from ANY replica; the durable object is REWRITTEN as
# the attempt runs — whenever 1 MiB is unflushed, or every 5s while anything is
# (damped for very large logs), with a final write when the attempt ends. An
# orderly shutdown flushes every open stream at SIGTERM; a hard kill loses only
# each running attempt's unflushed tail (typically the last few seconds), and the
# task itself is unaffected — the reconciler still recovers its outcome. Each
# rewrite is a full overwrite Put: on a VERSIONED bucket, add a lifecycle rule for
# noncurrent versions.
#
# Auth is keyless-first: bind THIS control-plane ServiceAccount to a cloud
# identity via `serviceAccount.annotations` and leave the credential fields empty.
#
# The RWX alternative (an NFS / EFS / Filestore / Azure Files / CephFS class) is
# `logs.persistence.enabled: true` + `accessMode: ReadWriteMany` + an RWX
# `storageClass`, with `logs.sink.provider: disk` — it flushes at 1 MiB without
# re-uploading, so keep it for clusters with no object store reachable from the
# control plane or where even a few seconds of log tail is unacceptable.
logs:
  persistence:
    enabled: false
  sink:
    # `s3` for AWS S3 / MinIO / Ceph RGW, `gcs` for Google Cloud Storage.
    provider: s3
    bucket: CHANGEME-leoflow-task-logs
    prefix: leoflow
    # [s3] Required by AWS S3; ignored by most S3-compatible stores.
    region: us-east-1

serviceAccount:
  annotations: {}
    # EKS (IRSA) for `s3`:
    # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/leoflow-control-plane
    # GKE (Workload Identity) for `gcs`:
    # iam.gke.io/gcp-service-account: leoflow-control-plane@PROJECT.iam.gserviceaccount.com

# ─── Memory sizing for the object sink ──────────────────────────────────────
# The object sink keeps each running attempt's log in RAM until the attempt ends
# (capped at 128 MiB per attempt): it flushes incrementally, but every flush
# re-uploads the whole object, so the full attempt stays resident. Peak memory
# therefore scales with CONCURRENT attempts × their log volume, not with the
# chart's 512Mi default limit in mind: a wide fan-out of chatty tasks can OOM a
# 512Mi control plane, and OOM is a restart. Size the limit for your fan-out —
# the requests below are a floor for a modest fleet, not a recommendation.
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

# ─── PodDisruptionBudget: auto ──────────────────────────────────────────────
# Left unset on purpose. `enabled` is tri-state and the default (auto) renders the
# PDB exactly when the guaranteed replica floor is above one — which it is here —
# keeping one replica serving while the other is evicted. Do NOT force it on a
# single replica: a `minAvailable: 1` budget over one pod blocks every voluntary
# eviction, so node drains hang and auto-upgrades stall. `AlwaysAllow` (the chart
# default) lets both replicas be evicted when both are already unhealthy, so a
# drain never hangs on a control plane that is already down.
podDisruptionBudget:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow

# ─── Drain grace ────────────────────────────────────────────────────────────
# A voluntary eviction sends SIGTERM and waits this long before SIGKILL. What the
# grace buys is headroom for the shutdown work that can finish: in-flight HTTP
# requests get up to 10s, then the dispatch pool drains so in-flight dispatches
# settle instead of leaving task instances stuck `queued`. It does NOT decide
# leadership handoff — the scheduler lease is released within a tick of SIGTERM,
# and frees anyway when the connection drops. With tasks running, open agent log
# streams are closed and flushed at SIGTERM and the gRPC stop is bounded (5s, then
# forced), so the shutdown completes within the grace instead of being SIGKILLed.
# 60 gives the HTTP + dispatch drain room under load without stretching every
# rollout much further.
terminationGracePeriodSeconds: 60

# ─── EKS / Karpenter only: eviction protection opt-in (NOT set by default) ──
# `karpenter.sh/do-not-disrupt: "true"` exempts the node running this pod from
# Karpenter's VOLUNTARY disruption (consolidation, drift, expiration). It trades
# maintenance friction — that node is never consolidated or upgraded by Karpenter
# while the pod runs — for eviction protection, and does nothing against
# involuntary disruptions (node failure, spot reclamation). A second replica plus
# the spread and the auto PDB is the platform-neutral answer; reach for this only
# when you have measured that consolidation still evicts faster than failover on
# your cluster.
# podAnnotations:
#   karpenter.sh/do-not-disrupt: "true"

# ─── The usual Pro prerequisites (external datastores, secrets) ─────────────
# External datastores are mandatory for Pro (the embedded ones are Lite-only). For
# HA these should themselves be highly available (managed Postgres with failover,
# managed Redis with replicas): the control plane is only as available as the
# stores it leader-elects on.
database:
  url: "postgres://leoflow:CHANGEME@postgres:5432/leoflow?sslmode=require"
redis:
  url: "redis://redis:6379/0"

auth:
  jwtSecret: "CHANGEME-jwt-signing-secret"
# 32 raw bytes or 64-char hex. Generate: openssl rand -hex 32
secretKey: "CHANGEME-leoflow-secret-key-32by"

# Agent gRPC TLS: the auto-generated CA (default) is fine for a hand-driven install.
# For GitOps (ArgoCD/Flux) use cert-manager instead — see values-pro-tls.yaml.
