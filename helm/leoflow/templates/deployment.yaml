{{- /*
The Pro edition (this chart) must use EXTERNAL managed datastores and must
never fall back to Lite's embedded backends (embedded Postgres / in-process XCom
+ tailer — ADR 0026/0027). The server selects embedded backends when no Redis URL
is set, so fail the install loudly with a clear message if Postgres or Redis is
not configured, rather than letting a misconfigured Pro deploy run embedded.
*/}}
{{- if and (not .Values.database.existingSecret) (not .Values.database.url) -}}
{{- fail "database.url or database.existingSecret is required: the Pro edition needs an external Postgres (the embedded datastore is Lite-only)." -}}
{{- end -}}
{{- if and (not .Values.redis.existingSecret) (not .Values.redis.url) -}}
{{- fail "redis.url or redis.existingSecret is required: the Pro edition needs an external Redis (the embedded XCom + log tailer is Lite-only)." -}}
{{- end -}}
{{- /*
Validate `secretKey` length up-front so a wrong key fails the install
with a clear error, not at runtime with a silent 503 on the Connections
API. The server's ParseKey (internal/secrets/cipher.go) accepts exactly
32 raw bytes OR 64-char hex OR base64-of-32-bytes; for chart-time
validation we cover the two unambiguous shapes (raw 32, hex 64) — the
base64 forms vary in padding so we let the server fall through. When
`secretKeyExistingSecret` is set, skip — the chart can't reach into an
out-of-band Secret to validate its contents (operator's responsibility).
*/ -}}
{{- if and .Values.secretKey (not .Values.secretKeyExistingSecret) -}}
{{- $len := len .Values.secretKey -}}
{{- if and (ne $len 32) (ne $len 64) -}}
{{- fail (printf "secretKey must be exactly 32 raw bytes or 64-char hex (got %d chars). Generate with: openssl rand -hex 32 (64 hex chars). See ADR 0019." $len) -}}
{{- end -}}
{{- end -}}
{{- /*
LEOFLOW_UI_EDITION below is the literal "pro" — this chart has no Lite mode — and
guardTLSForEdition refuses boot when a Pro control plane has no gRPC cert/key. So
agentTLS.enabled=false does not deploy a plaintext control plane, it deploys a
crash-looping one, and the operator only learns why from container logs. Refuse at
render instead. Keep the edition literal: it is the sole marker both boot guards
key on, so turning it into a value would hand operators a free one-flag bypass of
the TLS requirement AND of the insecure-secrets rejection. See #459, ADR 0014.
*/ -}}
{{- $agentTLS := .Values.agentTLS | default dict -}}
{{- if not $agentTLS.enabled -}}
{{- fail "agentTLS.enabled=false is not a supported configuration: this chart always deploys the Pro edition (LEOFLOW_UI_EDITION=pro) and the Pro control plane refuses to boot without a gRPC cert/key, so disabling TLS yields a CrashLoopBackOff (\"the Pro edition requires TLS on the agent gRPC channel\"), not a plaintext deployment. Provision a cert (cert-manager) and set agentTLS.serverCertSecret + agentTLS.caConfigMap. For a plaintext local loop use the Lite dev server (`leoflow dev lite`), not this chart." -}}
{{- end -}}
{{- /*
agentTLS pairs a server cert with a CA the task pods trust. The chart supplies
that material one of two ways: BYO (serverCertSecret + caConfigMap, typically
cert-manager) or auto-gen (agent-tls-autogen.yaml mints a stable self-signed CA +
server cert when autoGenerate is on — the #690 zero-prereq default). Only fail
when TLS is on, auto-gen is OFF, and the operator supplied no CA: that is the sole
combination with no CA at all, which would ship a control plane whose task pods
fail the cert chain (x509: unknown authority) and hang. See #280, #690.
*/ -}}
{{- if and .Values.agentTLS.enabled (not .Values.agentTLS.autoGenerate) (not .Values.agentTLS.caConfigMap) -}}
{{- fail "agentTLS has no CA source: task pods need a CA trust bundle to verify the gRPC server cert (otherwise the agent's dial fails x509: certificate signed by unknown authority and tasks hang). Either keep agentTLS.autoGenerate=true (default — the chart mints a stable self-signed CA + server cert, no cert-manager needed, #690), or set agentTLS.serverCertSecret + agentTLS.caConfigMap for BYO/cert-manager (production). See #280, #690." -}}
{{- end -}}
{{- /*
A ReadWriteOnce logs PVC attaches to a single node, so more than one replica —
whether static (replicaCount > 1) or via the HPA (autoscaling.enabled with
maxReplicas > 1, where replicaCount is ignored) — leaves the extra pods stuck on a
Multi-Attach error, silently from helm's view. The effective ceiling is
maxReplicas when autoscaling is on, else replicaCount. Fail with the RWX pointer.
See #282.
*/ -}}
{{- $maxReplicas := .Values.replicaCount -}}
{{- if .Values.autoscaling.enabled -}}
{{- $maxReplicas = .Values.autoscaling.maxReplicas -}}
{{- end -}}
{{- /* Split (ADR 0049): the scheduler writes logs and every api replica reads
them from the same PVC, so at least scheduler+api pods mount it at once — RWO can
never satisfy that. Treat the mounter count as api replicas + 1 (the scheduler). */ -}}
{{- if .Values.split.enabled -}}
{{- $maxReplicas = add (int .Values.split.api.replicaCount) 1 -}}
{{- end -}}
{{- if and (gt (int $maxReplicas) 1) .Values.logs.persistence.enabled (eq .Values.logs.persistence.accessMode "ReadWriteOnce") -}}
{{- fail "a ReadWriteOnce logs PVC attaches to only one pod, so more than one control-plane replica — replicaCount > 1, or autoscaling.enabled with maxReplicas > 1 — hangs the extra pods in ContainerCreating (Multi-Attach error), silently. Set logs.persistence.accessMode=ReadWriteMany with an RWX StorageClass (NFS / Longhorn-rwx / CephFS / EFS / Azure Files / GCP Filestore); or keep a single replica; or set logs.persistence.enabled=false (ephemeral emptyDir). See #282." -}}
{{- end -}}

{{- /*
Render one "all" Deployment (default, byte-identical to the pre-0049 monolith) or,
when split.enabled, separate api and scheduler Deployments — ADR 0049. The
scheduler is always a single leader (ADR 0009), so its replica count is pinned to 1
here regardless of split.scheduler.replicaCount.
*/ -}}
{{- if .Values.split.enabled }}
{{- include "leoflow.controlPlaneDeployment" (dict "ctx" . "role" "api" "replicas" .Values.split.api.replicaCount) | nindent 0 }}
---
{{- include "leoflow.controlPlaneDeployment" (dict "ctx" . "role" "scheduler" "replicas" 1) | nindent 0 }}
{{- else }}
{{- include "leoflow.controlPlaneDeployment" (dict "ctx" . "role" "all" "replicas" .Values.replicaCount) | nindent 0 }}
{{- end }}
