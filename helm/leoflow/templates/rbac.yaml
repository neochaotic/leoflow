{{- if .Values.rbac.create -}}
{{/*
The pod-per-task executor creates, lists, and deletes task pods in taskNamespace,
reads their logs, and provisions the per-run staging PVC. The Role lives in
taskNamespace (which may differ from the release namespace); the RoleBinding
grants it to the control plane's ServiceAccount.

Every rule below corresponds to a call the executor actually makes. Nothing here
is speculative, and nothing the executor calls is missing — scripts/rbac-covers-executor.sh
checks that both ways on every CI run, because this file and the code drifted
apart once already: the staging PVC calls shipped without their permission and
every DAG using ADR 0022's staging volume 403'd.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "leoflow.fullname" . }}-executor
  namespace: {{ .Values.taskNamespace }}
  labels:
    {{- include "leoflow.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # The per-run staging volume (ADR 0022): ensureStagingClaim creates the PVC on
  # first use and the GC deletes it when the run ends. Create is idempotent by
  # tolerating AlreadyExists rather than reading first, so no `get` is needed.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "delete"]
  # The warm-pool GC anchor (ADR 0058 D11): a per-dag-version ConfigMap that owns
  # the version's warm pods via an ownerReference, so on control-plane loss /
  # namespace teardown the pods are cascade-GC'd — the one orphan class the
  # reconciler-as-deleter cannot cover. EnsureWarmAnchor creates it (idempotent,
  # tolerating AlreadyExists) and GETs it to read the UID stamped on the owned
  # pods; the reconciler deletes it only once the version has fully drained.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "leoflow.fullname" . }}-executor
  namespace: {{ .Values.taskNamespace }}
  labels:
    {{- include "leoflow.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "leoflow.fullname" . }}-executor
{{- /*
ADR 0049: in split mode ONLY the scheduler SA is granted the executor Role — the
scheduler is what creates task pods. The api SA is deliberately left unbound so a
compromised/SSRF'd API cannot reach the apiserver. Non-split binds the single
"all" SA, unchanged. (A template comment, not a "#" line, so the non-split
rendered output stays byte-identical to the pre-0049 chart.)
*/}}
subjects:
  - kind: ServiceAccount
    name: {{ include "leoflow.roleServiceAccountName" (dict "ctx" . "role" (ternary "scheduler" "all" .Values.split.enabled)) }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
