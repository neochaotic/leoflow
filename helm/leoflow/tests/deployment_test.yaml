suite: control-plane Deployment env + security context
templates:
  # secret.yaml is in scope so the deployment's `checksum/secret` annotation
  # (#316) can resolve its `include` reference. helm-unittest only loads the
  # templates it sees here; an include of an out-of-scope template raises
  # `no template "..." associated`.
  - deployment.yaml
  - secret.yaml
release:
  name: leoflow
tests:
  - it: fails the install if database.url AND database.existingSecret are both empty
    template: deployment.yaml
    set:
      redis.url: redis://host/0
      auth.jwtSecret: jwt
      agentTLS.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "database.url or database.existingSecret is required: the Pro edition needs an external Postgres (the embedded datastore is Lite-only)."

  - it: fails the install if redis.url AND redis.existingSecret are both empty
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      auth.jwtSecret: jwt
      agentTLS.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "redis.url or redis.existingSecret is required: the Pro edition needs an external Redis (the embedded XCom + log tailer is Lite-only)."

  - it: omits LEOFLOW_SECRET_KEY env entry when neither secretKey nor secretKeyExistingSecret is set
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      agentTLS.enabled: false
      # NOT setting secretKey / secretKeyExistingSecret
    asserts:
      - hasDocuments:
          count: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_SECRET_KEY

  - it: wires LEOFLOW_SECRET_KEY from chart-managed Secret when secretKey is inline
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      agentTLS.enabled: false
      secretKey: leoflow-unittest-secretkey-32by!
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: leoflow-secrets
                key: secretKey

  - it: wires LEOFLOW_SECRET_KEY from existingSecret when secretKeyExistingSecret is set
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      agentTLS.enabled: false
      secretKeyExistingSecret: my-external-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: my-external-key
                key: secretKey

  - it: fails the install with a clear error when secretKey is set but wrong length (not 32 raw bytes / 64 hex chars)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      agentTLS.enabled: false
      secretKey: too-short-12345
    asserts:
      - failedTemplate:
          errorMessage: "secretKey must be exactly 32 raw bytes or 64-char hex (got 15 chars). Generate with: openssl rand -hex 16. See ADR 0019."

  - it: accepts 32-byte raw secretKey (AES-256)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      agentTLS.enabled: false
      secretKey: leoflow-unittest-secretkey-32by!
    asserts:
      - hasDocuments:
          count: 1

  - it: accepts 64-char hex secretKey (AES-256 encoded)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      agentTLS.enabled: false
      secretKey: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef  # gitleaks:allow — fixture, all-hex zeros pattern, not a credential
    asserts:
      - hasDocuments:
          count: 1

  - it: skips length validation when secretKeyExistingSecret is set (chart can't validate an out-of-band Secret)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      agentTLS.enabled: false
      secretKey: too-short-12345          # would normally fail
      secretKeyExistingSecret: my-key     # but the existingSecret takes precedence; chart can't validate it
    asserts:
      - hasDocuments:
          count: 1

  # #316: the pod template carries a `checksum/secret` annotation derived from
  # the chart-rendered Secret. Without it, `helm upgrade` that only changes
  # database.url / redis.url / jwtSecret (the values backing the Secret's
  # keys via secretKeyRef) updates the Secret but leaves the running pod on
  # the OLD values until a manual `kubectl rollout restart`. The annotation
  # tying the podTemplate's spec hash to the Secret content closes that gap.
  - it: "#316 — pod template carries a checksum/secret annotation tied to the rendered Secret"
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      agentTLS.enabled: false
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/secret"]
      # The checksum is a 64-char hex sha256 — pinpoint shape (not value)
      # so a value change here is intentional, not flaky.
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/secret"]
          pattern: "^[a-f0-9]{64}$"

  - it: "#316 — checksum/secret CHANGES when a Secret-backed value changes (proves the rollout-trigger)"
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt-original-value
      agentTLS.enabled: false
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/secret"]
          # The exact hash here is the snapshot of THIS values set; the next
          # test changes one value and expects a different hash. Without the
          # annotation both renders would have identical podTemplate specs
          # and `helm upgrade` would silently leave the old credentials live.
          pattern: "^[a-f0-9]{64}$"

  # #315 — Postgres CA injection knob. When database.caConfigMap is set, the
  # podTemplate gains a `db-ca` ConfigMap volume + a volumeMount at
  # /etc/leoflow/db-ca. Operators then pin
  # `sslmode=verify-full&sslrootcert=/etc/leoflow/db-ca/ca.crt` on the DSN —
  # pgx reads sslrootcert natively, so no Go-side wiring is needed.
  - it: "#315 — no db-ca volume rendered when database.caConfigMap is unset (regression guard)"
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      agentTLS.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.volumes[?(@.name == 'db-ca')]
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == 'db-ca')]

  - it: "#315 — database.caConfigMap mounts /etc/leoflow/db-ca/ca.crt readonly"
    template: deployment.yaml
    set:
      database.url: "postgres://h/d?sslmode=verify-full&sslrootcert=/etc/leoflow/db-ca/ca.crt"
      database.caConfigMap: managed-pg-ca
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      agentTLS.enabled: false
    asserts:
      # Volume: a ConfigMap named after the operator's ConfigMap, exposing
      # just the ca.crt key.
      - contains:
          path: spec.template.spec.volumes
          content:
            name: db-ca
            configMap:
              name: managed-pg-ca
              items:
                - key: ca.crt
                  path: ca.crt
      # VolumeMount: mounted readonly at the well-known path the DSN expects.
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: db-ca
            mountPath: /etc/leoflow/db-ca
            readOnly: true

  # #312 — managed-Redis verified TLS requires an operator-supplied CA bundle.
  # Without `redis.caConfigMap` set, NOTHING about the CA injection appears on
  # the rendered pod: no LEOFLOW_REDIS_CA_FILE env var, no volume, no
  # volumeMount. That is the regression guard — an unrelated chart change must
  # not start silently mounting an unconfigured CA path.
  - it: "#312 — Redis CA wiring is absent when redis.caConfigMap is unset (default)"
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: rediss://h/0
      auth.jwtSecret: jwt
      agentTLS.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_REDIS_CA_FILE
            value: /etc/leoflow/redis-ca/ca.crt
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: redis-ca
            mountPath: /etc/leoflow/redis-ca
            readOnly: true

  # #312 — When redis.caConfigMap is set, all three pieces must appear together:
  # env var pointing at the mount path, container volumeMount at that path,
  # and a pod-level volume sourcing the named ConfigMap.
  - it: "#312 — redis.caConfigMap wires env + volumeMount + volume in one go"
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: rediss://h/0
      auth.jwtSecret: jwt
      agentTLS.enabled: false
      redis.caConfigMap: redis-ca-bundle
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEOFLOW_REDIS_CA_FILE
            value: /etc/leoflow/redis-ca/ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: redis-ca
            mountPath: /etc/leoflow/redis-ca
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: redis-ca
            configMap:
              name: redis-ca-bundle

  - it: pod + container securityContext pin runAsNonRoot + UID 65532 (distroless nonroot)
    template: deployment.yaml
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      agentTLS.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
