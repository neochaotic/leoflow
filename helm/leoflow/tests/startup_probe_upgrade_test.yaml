suite: the startup probe survives an upgrade from a chart that never had it
templates:
  - deployment.yaml
  - secret.yaml
release:
  name: leoflow
set:
  database.url: postgres://h/d
  redis.url: redis://h/0
  auth.jwtSecret: jwt
tests:
  # `helm upgrade --reuse-values` does NOT merge the new chart's defaults: helm
  # rebuilds the previous release's coalesced values and uses them as the new
  # chart's values. probes.startup is the only key this chart gained since 0.4.6,
  # so upgrading a 0.4.6 release with that flag hands the new templates a values
  # tree in which probes.startup does not exist at all.
  #
  # Dereferencing it unguarded turned that into
  #   nil pointer evaluating interface {}.enabled
  # which is a hard render failure for every operator using the flag. Nothing
  # caught it because every test and every CI install starts from the chart's own
  # defaults, where the key is always present.
  - it: an upgrade whose values predate the key still renders
    set:
      probes.startup: null
    template: deployment.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: and the gate is simply absent rather than half-rendered
    set:
      probes.startup: null
    template: deployment.yaml
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].startupProbe
