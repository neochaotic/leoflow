suite: task-pod egress NetworkPolicy (ADR 0047/0048)
templates:
  - task-networkpolicy.yaml
tests:
  - it: not rendered when taskNetworkPolicy.enabled is false (default)
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
    asserts:
      - hasDocuments:
          count: 0

  - it: renders in taskNamespace, selects task pods, denies ingress, blocks metadata by default
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNamespace: tasks-ns
      taskNetworkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.namespace
          value: tasks-ns
      # selects every task pod by the run-id label they carry
      - equal:
          path: spec.podSelector.matchExpressions[0].key
          value: leoflow.io/run-id
      - equal:
          path: spec.podSelector.matchExpressions[0].operator
          value: Exists
      # ingress denied (nothing dials into a task pod)
      - equal:
          path: spec.ingress
          value: []
      - contains:
          path: spec.policyTypes
          content: Egress
      # the metadata endpoint is in the egress except-list by default
      - contains:
          path: spec.egress[2].to[0].ipBlock.except
          content: 169.254.0.0/16

  - it: blockPrivateNetworks adds RFC1918 to the except-list; metadata still blocked
    set:
      database.url: postgres://h/d
      redis.url: redis://h/0
      auth.jwtSecret: jwt
      taskNetworkPolicy.enabled: true
      taskNetworkPolicy.blockPrivateNetworks: true
    asserts:
      - contains:
          path: spec.egress[2].to[0].ipBlock.except
          content: 10.0.0.0/8
      - contains:
          path: spec.egress[2].to[0].ipBlock.except
          content: 169.254.0.0/16
