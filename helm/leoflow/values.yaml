# Default values for the Leoflow control plane chart.

image:
  # -- Control-plane image. Published by `release.yaml` on every tag, signed with cosign.
  repository: ghcr.io/neochaotic/leoflow-server
  # -- Image tag. Defaults to `.Chart.appVersion` when empty; pre-alpha installs should pin `--set image.tag=v0.0.1-prealpha.N`.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# -- Number of control-plane replicas. The scheduler leader-elects (ADR 0009), so `>1` is HA-safe (active-passive scheduler, active-active API).
replicaCount: 1

# taskNamespace is where the control plane creates task pods. It MUST match the
# namespace the server expects (the code currently targets "leoflow"); the chart
# grants the control plane RBAC to manage pods here.
taskNamespace: leoflow

serviceAccount:
  create: true
  name: ""             # defaults to the fullname when empty
  annotations: {}

rbac:
  # create a Role/RoleBinding letting the control plane create/watch/delete task
  # pods (and read their logs) in taskNamespace — the pod-per-task executor.
  create: true

# Ports the server listens on (must match server.*Addr below).
ports:
  http: 8080
  metrics: 9090
  grpc: 9091

service:
  type: ClusterIP
  annotations: {}

# config maps to LEOFLOW_* env. Non-secret settings live here; secrets below.
config:
  logsDir: /var/log/leoflow
  scheduler:
    enabled: true
    loopIntervalMs: 1000
  cors:
    allowedOrigins:
      - "*"
  # agentControlPlaneAddr is what task pods dial back for gRPC. Defaults to the
  # in-cluster Service DNS on the gRPC port when left empty.
  agentControlPlaneAddr: ""

# Database (Postgres). Provide an external URL, or a pre-existing secret.
database:
  # -- External Postgres DSN. Required for Pro (the embedded datastore is Lite-only); the chart `fail`s the install if neither this nor `existingSecret` is set. Example: `postgres://user:pass@host:5432/leoflow?sslmode=disable`.
  url: ""
  # -- Name of a Secret with key `databaseUrl` (takes precedence over `url`).
  existingSecret: ""
  maxOpenConns: 20
  maxIdleConns: 5

# Redis (XCom + locks).
redis:
  # -- External Redis URI. Required for Pro (the embedded XCom is Lite-only). Example: `redis://host:6379/0`, or `rediss://host:6380/0` for TLS.
  url: ""
  # -- Name of a Secret with key `redisUrl` (takes precedence over `url`).
  existingSecret: ""

auth:
  # -- HMAC secret signing API + agent JWTs. Set inline OR reference an existing Secret via `existingSecret`. Generate with `openssl rand -base64 64`.
  jwtSecret: ""
  # -- Name of a Secret with key `jwtSecret` (takes precedence over `jwtSecret`).
  existingSecret: ""
  tokenTtlSeconds: 3600

# secretKey (LEOFLOW_SECRET_KEY) is the 32-byte key the control plane uses to
# encrypt connection passwords + Extra blobs at rest (ADR 0019). Without it,
# Connection management is disabled and the API rejects writes with 503
# (Variables still work). Set it, or reference an existing secret.
#
# Generate one with:  openssl rand -hex 16   (64 hex chars = 32 bytes)
# -- AES-256 key encrypting Connection passwords + Extra at rest (ADR 0019). MUST be exactly 32 raw bytes OR 64-char hex OR base64-of-32-bytes. Without it, Connection management is disabled (Variables still work).
secretKey: ""
# -- Name of a Secret with key `secretKey` (takes precedence over `secretKey`).
secretKeyExistingSecret: ""

# bootstrap creates the initial admin user on first start when set.
bootstrap:
  # -- Initial admin password (first install only). Leave empty to skip the bootstrap; the operator then creates the first admin out-of-band.
  password: ""
  # -- Name of a Secret with key `bootstrapPassword` (takes precedence over `password`).
  existingSecret: ""

# migrations runs golang-migrate as a pre-install/pre-upgrade hook Job before the
# server starts. The image must contain the migrations and migrate binary.
migrations:
  enabled: true
  image:
    # leoflow-migrate bundles the Leoflow SQL migrations on top of
    # `migrate/migrate` (deploy/Dockerfile.migrate). Published by
    # `.github/workflows/release.yaml` on every tag, signed with cosign,
    # multi-arch (amd64 + arm64).
    #
    # Tag defaults to the chart's appVersion, which may not match the latest
    # released image tag (the chart's appVersion currently lags the leoflow-
    # server release cadence). For pre-alpha installs, explicitly pin:
    #   --set migrations.image.tag=v0.0.1-prealpha.18
    repository: ghcr.io/neochaotic/leoflow-migrate
    tag: ""
    pullPolicy: IfNotPresent
  # path of the migrations dir inside the image.
  path: /migrations
  # Pod security for the pre-install/pre-upgrade Job. K8s' restricted Pod
  # Security Admission requires runAsNonRoot + a numeric runAsUser on
  # every pod, including hook Jobs. The Deployment is hardened identically
  # (top-level podSecurityContext); these defaults mirror that posture so
  # restricted-PSA clusters accept the migration Job too.
  #
  # The migrate/migrate base image runs as root by default, but the binary
  # is a static Go binary that works fine under any UID — verified locally
  # via `docker run --rm -u 65532:65532 migrate/migrate -version` and
  # `ls /migrations` (migrations are world-readable, mode 644).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 65532
    capabilities:
      drop: ["ALL"]

# TLS for the agent <-> control plane gRPC channel (issue #58). Off by default
# (the per-task token still authenticates each call). When enabled, the control
# plane serves gRPC over TLS using serverCertSecret, and task pods mount caConfigMap
# so the agent verifies the server cert. Typically both are produced by
# cert-manager (a Certificate Secret + a trust-bundle/CA ConfigMap).
agentTLS:
  enabled: false
  # Secret (type kubernetes.io/tls) with tls.crt/tls.key for the gRPC server —
  # e.g. created by a cert-manager Certificate. Required when enabled.
  serverCertSecret: ""
  # ConfigMap with key ca.crt, mounted into task pods to verify the server cert.
  caConfigMap: ""

observability:
  otel:
    enabled: false
    endpoint: ""
  logFormat: json
  logLevel: info

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: leoflow.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

podAnnotations: {}
# podSecurityContext: K8s enforces `runAsNonRoot: true` by verifying the UID.
# The control-plane image (deploy/Dockerfile.server) sets `USER nonroot:nonroot`
# — a named user, not a numeric UID — so K8s cannot prove non-root and rejects
# the pod with `CreateContainerConfigError: container has runAsNonRoot and
# image has non-numeric user (nonroot)`. Pin `runAsUser` / `runAsGroup` to the
# `nonroot` distroless UID (65532, the de-facto standard from Google's distroless
# images) so the enforcement passes. Override if you bake your own image.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
