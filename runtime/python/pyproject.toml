[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leoflow-runtime"
version = "0.1.0"
description = "Leoflow task runtime: runs user callables and bridges XCom inside task containers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # jinja2 is optional at runtime (bash-only images fall back to raw + env vars,
    # see _render_bash), but the test suite needs it to exercise the render happy path.
    "jinja2>=3.0",
]

[tool.hatch.build]
# Hatchling excludes VCS-ignored files by default, and it resolves the patterns
# it finds against ITS OWN root (runtime/python), not the repository root. The
# repo's .gitignore line 25 is `/leoflow` — anchored, so git correctly does not
# ignore runtime/python/leoflow, but hatchling read it as "the leoflow directory
# at my root" and silently dropped the package from the wheel. Nothing failed:
# the build succeeded, the wheel just had no `leoflow` in it, which is #17 all
# over again. The include list below is explicit, so opting out of VCS ignores
# costs nothing.
ignore-vcs = true

[tool.hatch.build.targets.wheel]
# Two packages: the task runtime, and the `leoflow` authoring names a user's
# dag.py imports at the top of the file — runner.py re-imports that module in
# every python task pod, so they have to resolve there too (#17).
packages = ["leoflow_runtime", "leoflow"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108"]

[tool.pytest.ini_options]
addopts = "-q"
